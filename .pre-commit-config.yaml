repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
      - id: detect-private-key

  # yaml formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, html, css, javascript, json]

  # clojure code formatting and linting
  - repo: local
    hooks:
      - id: zprint
        name: zprint
        entry: ./scripts/ci/zprint.sh
        language: script
        types: [clojure]
        exclude_types: [edn]
        require_serial: true

      - id: clj-kondo
        name: clj-kondo
        entry: ./scripts/ci/clj-kondo.sh
        language: script
        args: [--lint]
        types: [clojure]
        exclude_types: [edn]
        require_serial: true

  # C / C++ formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # Java formatting
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-java
        args: [--autofix]
        types: [java]
